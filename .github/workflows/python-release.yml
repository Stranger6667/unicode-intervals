name: Python Release

on:
  push:
    tags:
      - python-v*
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MANIFEST: crates/unicode-intervals-py/Cargo.toml

jobs:
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv build --sdist --out-dir dist crates/unicode-intervals-py
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  # Every target gets an `abi3` wheel (CPython 3.10+) and an `abi3t` wheel (CPython 3.15+,
  # free-threaded included). Targets with `interpreter` also get wheels for the interpreters
  # neither of those covers: free-threaded 3.14 and PyPy.
  wheels:
    name: wheels (${{ matrix.os }} / ${{ matrix.target }} / ${{ matrix.manylinux }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64
            manylinux: auto
            interpreter: python3.14t pypy3.11 pypy3.12
          - os: ubuntu-24.04
            target: x86_64
            manylinux: musllinux_1_2
            interpreter: python3.14t
          - os: ubuntu-24.04
            target: aarch64
            manylinux: auto
            interpreter: python3.14t pypy3.11 pypy3.12
          - os: ubuntu-24.04
            target: aarch64
            manylinux: musllinux_1_2
            interpreter: python3.14t
          - os: macos-15
            target: x86_64
            manylinux: ''
            interpreter: python3.14t pypy3.11 pypy3.12
          - os: macos-15
            target: aarch64
            manylinux: ''
            interpreter: python3.14t pypy3.11 pypy3.12
          - os: windows-2025
            target: x64
            manylinux: ''
            interpreter: python3.14t pypy3.11 pypy3.12
          - os: ubuntu-24.04
            target: i686
            manylinux: auto
          - os: ubuntu-24.04
            target: i686
            manylinux: musllinux_1_2
          - os: ubuntu-24.04
            target: armv7
            manylinux: auto
          - os: ubuntu-24.04
            target: armv7
            manylinux: musllinux_1_2
          - os: ubuntu-24.04
            target: riscv64
            manylinux: auto
          - os: ubuntu-24.04
            target: riscv64
            manylinux: musllinux_1_2
          - os: ubuntu-24.04
            target: ppc64le
            manylinux: auto
          - os: ubuntu-24.04
            target: ppc64le
            manylinux: musllinux_1_2
          - os: ubuntu-24.04
            target: s390x
            manylinux: auto
          - os: windows-2025
            target: x86
            python-architecture: x86
            manylinux: ''
          - os: windows-11-arm
            target: aarch64
            manylinux: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python-architecture }}
      - name: Build wheels for free-threaded 3.14 and PyPy
        if: ${{ matrix.interpreter }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release -m ${{ env.MANIFEST }} --out dist --interpreter ${{ matrix.interpreter }}
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release -m ${{ env.MANIFEST }} --out dist
      - uses: actions/setup-python@v6
        id: abi3t-python
        with:
          python-version: '3.15'
          architecture: ${{ matrix.python-architecture }}
      - name: Build abi3t wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release -m ${{ env.MANIFEST }} --out dist --no-default-features --features abi3t
            --interpreter ${{ matrix.manylinux && 'python3.15' || steps.abi3t-python.outputs.python-path }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          if-no-files-found: error
          path: dist/*.whl

  pyodide:
    runs-on: ubuntu-24.04
    env:
      PYODIDE_VERSION: 314.0.7
      PYODIDE_BUILD_VERSION: 0.39.2
      PYODIDE_PYTHON_VERSION: 3.14.2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYODIDE_PYTHON_VERSION }}
      - name: Install pyodide-build and the Pyodide cross-build environment
        run: |
          pip install pyodide-build==${{ env.PYODIDE_BUILD_VERSION }}
          pyodide xbuildenv install ${{ env.PYODIDE_VERSION }}
      - run: rustup target add wasm32-unknown-emscripten
      - run: pyodide build crates/unicode-intervals-py --outdir dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-pyodide
          if-no-files-found: error
          path: dist/*.whl

  release:
    name: Release
    runs-on: ubuntu-24.04
    if: "startsWith(github.ref, 'refs/tags/')"
    needs:
      - sdist
      - wheels
      - pyodide
    environment: pypi
    permissions:
      contents: write
      id-token: write # Trusted Publishing on PyPI
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Extract version
        run: echo "version=${GITHUB_REF#refs/tags/python-v}" >> "$GITHUB_ENV"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          make_latest: false
          draft: true
          name: "[Python] Release ${{ env.version }}"
          files: dist/*
